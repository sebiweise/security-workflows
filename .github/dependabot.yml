version: 2
updates:
  # Bumps the version tags of the actions in .github/workflows/. The scanner images in
  # scan.yml are not seen by any ecosystem and are bumped by hand (README.md).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
